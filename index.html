<body>
<style>
:root{
  --ground:#ffffff; --panel:rgba(255,255,255,.66); --panel2:rgba(255,255,255,.5);
  --ink:#111114; --soft:#6c6c74; --dim:#9c9ca6; --line:#e9e6ef; --hair:#dcd8e6;
  --lilac:#8a6ec9; --magenta:#ee7ab4; --peach:#f6c49b; --lav:#cdc4ea; --sky:#bcd2ee;
  --done:#8a6ec9; --check:#ee7ab4;
  --glow1:rgba(243,159,199,.26); --glow2:rgba(205,196,234,.30); --glow3:rgba(246,196,155,.13);
  --p-alab:#8a6ec9; --p-neft:#7f9bce; --p-blok:#ee7ab4; --p-pr32:#9f86d6; --p-ikos:#e0a06a;
  --p-scale:#6f93c4; --p-mtra:#ef8f6a; --p-est:#c78bbd; --p-kuk:#8f7fb8; --p-pt:#8a8f98;
  --p-lice:#5fb3ba; --p-lev:#d4809b; --p-mila:#b3944f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111116; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.03);
  --ink:#f0eef5; --soft:#9a9aa6; --dim:#6e6e7a; --line:#2a2a34; --hair:#343440;
  --lilac:#b7a2e8; --magenta:#f193c4; --lav:#a89bd6;
  --done:#b7a2e8; --check:#f193c4;
  --glow1:rgba(238,122,180,.14); --glow2:rgba(138,110,201,.18); --glow3:rgba(246,196,155,.07);
  --p-alab:#b7a2e8; --p-neft:#93aede; --p-blok:#f193c4; --p-pr32:#b39ae6; --p-ikos:#e8b183;
  --p-scale:#87a8d8; --p-mtra:#f4a684; --p-est:#d9a3d0; --p-kuk:#a695cd; --p-pt:#9ea3ad;
  --p-lice:#7fd0d7; --p-lev:#eb9db4; --p-mila:#d6bb7a;
}}
:root[data-theme="dark"]{
  --ground:#111116; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.03);
  --ink:#f0eef5; --soft:#9a9aa6; --dim:#6e6e7a; --line:#2a2a34; --hair:#343440;
  --lilac:#b7a2e8; --magenta:#f193c4; --lav:#a89bd6;
  --done:#b7a2e8; --check:#f193c4;
  --glow1:rgba(238,122,180,.14); --glow2:rgba(138,110,201,.18); --glow3:rgba(246,196,155,.07);
  --p-alab:#b7a2e8; --p-neft:#93aede; --p-blok:#f193c4; --p-pr32:#b39ae6; --p-ikos:#e8b183;
  --p-scale:#87a8d8; --p-mtra:#f4a684; --p-est:#d9a3d0; --p-kuk:#a695cd; --p-pt:#9ea3ad;
  --p-lice:#7fd0d7; --p-lev:#eb9db4; --p-mila:#d6bb7a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:300;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-size:15px;
  background-image:
    radial-gradient(58% 42% at 94% 2%, var(--glow1), var(--glow3) 46%, transparent 72%),
    radial-gradient(52% 38% at 4% 99%, var(--glow2), transparent 76%);
  background-attachment:fixed;background-repeat:no-repeat}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 60px}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px;border-radius:6px}

header.top{padding:26px 0 0}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.mark{font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1}
.mark span{color:var(--lilac)}
.kicker{text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:var(--lilac);font-weight:500;margin-bottom:9px}
h1{font-size:clamp(29px,4.4vw,42px);line-height:1.05;font-weight:300;margin:.16em 0 .1em}
.sub{color:var(--soft);font-size:15px;max-width:46ch}
.mrow{display:flex;align-items:center;gap:10px}
.mnav{font-size:19px;line-height:1;color:var(--dim);border:1px solid var(--line);border-radius:9px;
  padding:3px 11px 5px;background:var(--panel);transition:color .15s,border-color .15s}
.mnav:hover{color:var(--lilac);border-color:var(--hair)}

.sync-row{margin-top:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tools button,.fbtn{font:inherit;font-size:12.5px;font-weight:500;color:var(--lilac);border:1px solid var(--hair);
  border-radius:9px;padding:5px 13px;cursor:pointer;background:var(--panel);transition:background .15s}
.tools button:hover,.fbtn:hover{background:var(--panel2)}
.bar{display:block;flex:1 1 200px;height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:150px}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--done),var(--check));transition:width .4s ease}
.pnum{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pnum b{color:var(--ink);font-weight:500}
.sync{font-size:11px;color:var(--dim);letter-spacing:.04em}

<script>
window.__SAVED__ = null; // SAVEDLINE

const PROJ = {
  alab:{n:"a.lab", c:"--p-alab"},
  lice:{n:"Lari · мороженое", c:"--p-lice"},
  lev: {n:"Lari · мероприятия", c:"--p-lev"},
  mila:{n:"Milado", c:"--p-mila"},
  neft:{n:"Нефть", c:"--p-neft"},
  blok:{n:"Блок 12", c:"--p-blok"},
  pr32:{n:"Принцип 32", c:"--p-pr32"},
  ikos:{n:"Ikos Fanas", c:"--p-ikos"},
  scale:{n:"Scale", c:"--p-scale"},
  mtra:{n:"MTRA", c:"--p-mtra"},
  est: {n:"ESTEDO", c:"--p-est"},
  kuk: {n:"Cookies", c:"--p-kuk"},
  pt:  {n:"Проектные технологии", c:"--p-pt"}
};

const MN = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MNB = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MNR = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const SH = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DAYN = ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];

const KEY = "alab-report";
const MKEY = "alab-report-month";
const TABKEY = "alab-report-tab";

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2 = n => String(n).padStart(2, "0");
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.15 6.15 4.75 8.85 9.85 3.15" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- данные ---------- */
let DB = {};           // { "2026-09": {tasks:[], st:{}, notes:{}} }

function apply(v){ if (v && v.db) DB = v.db; }
const OLD_P = {site:"alab", prem:"alab", mn:"alab", g8:"alab"};
function migrate(){                                        // старые записи: проекты a.lab слиты, недели -> даты
  Object.keys(DB).forEach(k => {
    const d = DB[k];
    if (!d || !d.tasks) return;
    const y = Number(k.slice(0,4)), m = Number(k.slice(5,7)) - 1;
    const ws = weeksOf(y, m);
    d.tasks.forEach(t => {
      if (OLD_P[t.p]) t.p = OLD_P[t.p];
      if (t.day === undefined) t.day = "";
      if (t.w === undefined || t.w === null || t.w === ""){
        const n = t.day && t.day.slice(0,7) === k ? Number(t.day.slice(8)) : 0;
        const w = n ? ws.find(x => n >= x.from && n <= x.to) : null;
        t.w = w ? String(w.i) : "m";
      }
    });
  });
}
function mergeIn(v){                                 // складывает чужие данные с текущими, ничего не затирая
  const inc = (v && v.db) || {};
  Object.keys(inc).forEach(k => {
    if (!DB[k]) DB[k] = {tasks:[], st:{}, notes:{}};
    const cur = DB[k], add = inc[k] || {};
    (add.tasks || []).forEach(t => { if (!cur.tasks.some(x => x.id === t.id)) cur.tasks.push(t); });
    Object.keys(add.st || {}).forEach(id => {
      const c0 = cur.st[id] || {d:false, c:false}, i0 = add.st[id] || {};
      cur.st[id] = {d: c0.d || !!i0.d, c: c0.c || !!i0.c};
    });
    Object.keys(add.notes || {}).forEach(n => {
      if (!cur.notes[n]) cur.notes[n] = {};
      ["res","chief"].forEach(f => {
        const val = (add.notes[n] || {})[f];
        if (val && !cur.notes[n][f]) cur.notes[n][f] = val;
      });
    });
  });
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* приватный режим браузера */ }
  if (raw){ try { apply(JSON.parse(raw)); } catch (e) {} }
  if (window.__SAVED__) mergeIn(window.__SAVED__);   // данные из файла добавляются к моим, не заменяют их
}
function payload(){ return {db:DB, saved:new Date().toISOString()}; }

const BKEY = "alab-report-backups";
const FKEY = "alab-report-file-saved";                // когда последний раз скачивали копию файла
const HKEY = "alab-report-warn-hidden";               // когда напоминание отложили
function backup(){                                   // снимок прежнего состояния, до записи нового
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    let list = [];
    try { list = JSON.parse(localStorage.getItem(BKEY) || "[]"); } catch (e) {}
    if (list[0] && list[0].data === raw) return;
    if (list[0] && Date.now() - Date.parse(list[0].at) < 15 * 60 * 1000) return;   // не чаще раза в 15 минут
    list.unshift({at:new Date().toISOString(), data:raw});
    localStorage.setItem(BKEY, JSON.stringify(list.slice(0, 12)));
  } catch (e) {}
}
function backups(){
  try { return JSON.parse(localStorage.getItem(BKEY) || "[]"); } catch (e) { return []; }
}
function save(){
  backup();
  try { localStorage.setItem(KEY, JSON.stringify(payload())); }
  catch (e) { const el = document.getElementById("sync");
              if (el) el.textContent = "браузер не разрешает сохранение - выгрузите отметки в файл"; }
}

const NOW = new Date();
let Y, M;                                  // выбранный месяц
try {
  const s = localStorage.getItem(MKEY);
  if (s && /^\d{4}-\d{2}$/.test(s)) { Y = +s.slice(0,4); M = +s.slice(5,7) - 1; }
} catch (e) {}
if (Y == null) { Y = NOW.getFullYear(); M = NOW.getMonth(); }

const mkey = () => Y + "-" + pad2(M + 1);
function mdata(){
  const k = mkey();
  if (!DB[k]) DB[k] = {tasks:[], st:{}, notes:{}};
  const d = DB[k];
  if (!d.tasks) d.tasks = []; if (!d.st) d.st = {}; if (!d.notes) d.notes = {};
  return d;
}
const st = id => mdata().st[id] || {d:false, c:false};

/* ---------- недели месяца ---------- */
function weeksOf(y, m){
  const last = new Date(y, m + 1, 0).getDate(), out = [];
  let s = 1;
  while (s <= last){
    const dow = (new Date(y, m, s).getDay() + 6) % 7;      // 0 = понедельник
    const e = Math.min(s + (6 - dow), last);
    out.push({i:out.length + 1, from:s, to:e});
    s = e + 1;
  }
  return out;
}
function dayWithDow(w, target){                            // число месяца с нужным днём недели, 0 - нет
  for (let n = w.from; n <= w.to; n++) if ((new Date(Y, M, n).getDay() + 6) % 7 === target) return n;
  return 0;
}
let WEEKS = [];
const wkLabel = w => w.from === w.to ? (w.from + " " + MNR[M]) : (w.from + "-" + w.to + " " + MNR[M]);
const isThisMonth = () => NOW.getFullYear() === Y && NOW.getMonth() === M;
const today = () => isThisMonth() ? NOW.getDate() : 0;
function curWeek(){
  const t = today(); if (!t) return 0;
  const w = WEEKS.find(x => t >= x.from && t <= x.to);
  return w ? w.i : 0;
}

/* ---------- выборка ---------- */
const dOf = t => t.day || "";
function weekOfDay(day){                                   // "2026-09-10" -> номер недели месяца, 0 если не наш месяц
  if (!day || day.slice(0,7) !== mkey()) return 0;
  const n = Number(day.slice(8)), w = WEEKS.find(x => n >= x.from && n <= x.to);
  return w ? w.i : 0;
}
function wOf(t){                                           // где задача: "m" или номер недели
  const byDay = weekOfDay(dOf(t));
  if (byDay) return byDay;                                 // дата всегда главнее
  return String(t.w || "m") === "m" ? "m" : Number(t.w);
}
function tasksOf(w){
  const list = mdata().tasks.filter(t => String(wOf(t)) === String(w));
  if (String(w) === "m") return list;
  return list.sort((a, b) => {                             // сначала по датам, потом задачи без дня
    const x = dOf(a), y = dOf(b);
    if (x && y) return x.localeCompare(y);
    return x ? -1 : y ? 1 : 0;
  });
}
function dayLabel(day){                                    // "2026-09-10" -> "чт 10"
  if (!day) return "";
  const d = new Date(day + "T00:00:00");
  return SH[(d.getDay() + 6) % 7].toLowerCase() + " " + d.getDate();
}
function dateCell(t){
  const v = dOf(t);
  const btn = v
    ? '<button class="undate" data-id="' + t.id + '" title="Убрать дату: задача останется в плане недели, без конкретного дня">без даты</button>'
    : (String(wOf(t)) === "m" ? ""
       : '<button class="tomonth" data-id="' + t.id + '" title="Перенести задачу в план месяца">в месяц</button>');
  return '<span class="dcell">'
    + '<input type="date" class="dinp" data-id="' + t.id + '" value="' + esc(v) + '" title="Дата задачи - по ней задача попадает в неделю">'
    + btn + '<span class="dtxt">' + esc(dayLabel(v)) + '</span></span>';
}
function count(list){
  let d = 0, c = 0;
  list.forEach(t => { const s = st(t.id); if (s.d) d++; if (s.c) c++; });
  return {n:list.length, d:d, c:c};
}
function barHTML(k){
  const p = k.n ? Math.round(k.d / k.n * 100) : 0;
  return '<span class="bar"><i style="width:' + p + '%"></i></span>';
}

/* ---------- вкладки ---------- */
let tab = "m";
try { tab = localStorage.getItem(TABKEY) || "m"; } catch (e) {}

function tabList(){

/* ---------- строки задач ---------- */
function projOptions(sel){

/* ---------- рендер ---------- */
function renderAll(){

    ? "выполнено <b>" + k.d + "</b> из <b>" + k.n + "</b> · проверено <b>" + k.c + "</b>"
    : "задач пока нет";

  const y = window.scrollY;
  document.getElementById("view").innerHTML =
    tab === "m" ? monthHTML() : tab === "sum" ? sumHTML() : weekHTML(Number(tab.slice(1)));

/* ---------- действия ---------- */
function setTab(id){
  tab = id;
  try { localStorage.setItem(TABKEY, tab); } catch (e) {}
  renderAll();
  window.scrollTo({top:0, behavior:"smooth"});
}
function shiftMonth(step){
  M += step;
  if (M > 11) { M = 0; Y++; } if (M < 0) { M = 11; Y--; }
  try { localStorage.setItem(MKEY, mkey()); } catch (e) {}
  tab = "m";
  try { localStorage.setItem(TABKEY, tab); } catch (e) {}
  renderAll();
}
document.getElementById("prevM").addEventListener("click", () => shiftMonth(-1));
document.getElementById("nextM").addEventListener("click", () => shiftMonth(1));

document.addEventListener("click", e => {
  const b = e.target.closest(".tick");
  if (b){
    const id = b.dataset.id, cur = st(id);
    mdata().st[id] = {d: b.dataset.k === "d" ? !cur.d : cur.d, c: b.dataset.k === "c" ? !cur.c : cur.c};
    save(); renderAll(); return;
  }
  const tb = e.target.closest("nav.tabs button");
  if (tb){ setTab(tb.dataset.tab); return; }
  const go = e.target.closest("[data-go]");
  if (go){ setTab(go.dataset.go); return; }
  const un = e.target.closest(".undate");
  if (un){ setDate(un.dataset.id, ""); return; }
  const tm = e.target.closest(".tomonth");
  if (tm){ toMonth(tm.dataset.id); return; }
  const del = e.target.closest(".del");
  if (del){
    const d = mdata(), i = d.tasks.findIndex(x => x.id === del.dataset.id);
    if (i < 0) return;
    if (!confirm("Удалить задачу «" + d.tasks[i].t + "»?")) return;
    delete d.st[d.tasks[i].id];
    d.tasks.splice(i, 1);
    save(); renderAll(); return;
  }
  const ed = e.target.closest(".edit");
  if (ed){
    const id = ed.dataset.id, el = document.querySelector('.tt[data-id="' + id + '"]');
    const t = mdata().tasks.find(x => x.id === id);
    if (!el || !t || el.dataset.editing) return;
    el.dataset.editing = "1";
    const inp = document.createElement("input");
    inp.className = "tedit"; inp.value = t.t;
    el.replaceWith(inp); inp.focus(); inp.select();
    const finish = ok => {
      if (inp.dataset.done) return;
      inp.dataset.done = "1";
      const v = inp.value.trim();
      if (ok && v) { t.t = v; save(); }
      renderAll();
    };
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Enter") finish(true);
      if (ev.key === "Escape") finish(false);
    });
    inp.addEventListener("blur", () => finish(true));
  }
});

document.addEventListener("change", e => {
  const ps = e.target.closest(".psel");
  if (ps){
    const t = mdata().tasks.find(x => x.id === ps.dataset.id);
    if (t) { t.p = ps.value; save(); renderAll(); }
    return;
  }
  const di = e.target.closest(".dinp");
  if (di){ setDate(di.dataset.id, di.value || ""); }
});

function setDate(id, v){
  const d = mdata(), i = d.tasks.findIndex(x => x.id === id);
  if (i < 0) return;
  const t = d.tasks[i];
  if (!v){                                                  // день снят, неделя остаётся прежней
    t.w = String(wOf(t));
    t.day = "";
  } else if (v.slice(0,7) !== mkey()){                      // дата другого месяца - задача переезжает туда
    const k2 = v.slice(0,7);
    if (!DB[k2]) DB[k2] = {tasks:[], st:{}, notes:{}};
    const ws = weeksOf(Number(k2.slice(0,4)), Number(k2.slice(5,7)) - 1);
    const n = Number(v.slice(8)), wk = ws.find(x => n >= x.from && n <= x.to);
    t.day = v; t.w = wk ? String(wk.i) : "m";
    DB[k2].tasks.push(t);
    if (d.st[id]) { DB[k2].st[id] = d.st[id]; delete d.st[id]; }
    d.tasks.splice(i, 1);
  } else {
    t.day = v;
    t.w = String(weekOfDay(v) || "m");
  }
  save(); renderAll();
}
function toMonth(id){                                       // задача уходит в план месяца
  const t = mdata().tasks.find(x => x.id === id);
  if (!t) return;
  t.day = ""; t.w = "m";
  save(); renderAll();
}

document.addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-note]");
  if (!ta) return;
  const n = mdata().notes;
  const k = ta.dataset.note;
  if (!n[k]) n[k] = {};
  n[k][ta.dataset.f] = ta.value;
  if (ta.dataset.f === "res") syncNote(k, ta.value);
  save();                                    // без перерисовки: курсор остаётся в поле
});

document.addEventListener("submit", e => {
  const f = e.target.closest(".addrow");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), title = (fd.get("t") || "").toString().trim();
  if (!title) return;
  const day = (fd.get("d") || "").toString();
  const task = {
    id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    t: title,
    p: (fd.get("p") || "alab").toString(),
    day: day,
    w: day ? String(weekOfDay(day) || "m") : String(f.dataset.w || "m")
  };
  if (day && day.slice(0,7) !== mkey()){                    // дата другого месяца - задача уходит туда
    const k2 = day.slice(0,7);
    if (!DB[k2]) DB[k2] = {tasks:[], st:{}, notes:{}};
    DB[k2].tasks.push(task);
  } else mdata().tasks.push(task);
  save(); renderAll();
  const el = document.querySelector('.addrow input[name="t"]');
  if (el) el.focus();
});

/* ---------- файлы ---------- */
function download(text, name, type){
  const blob = new Blob([text], {type: type || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function syncNote(k, v){                              // в печать текст идёт блоком, не полем ввода
  const el = document.querySelector('.nbtxt[data-note-txt="' + k + '"]');
  if (el) el.textContent = v;
}
const DAY = 24 * 3600 * 1000;
function renderWarn(){
  const box = document.getElementById("warn");
  const tasks = Object.keys(DB).reduce((s, k) => s + ((DB[k].tasks || []).length), 0);
  if (!tasks) { box.hidden = true; return; }
  let saved = 0, hidden = 0;
  try { saved = Date.parse(localStorage.getItem(FKEY) || "") || 0; } catch (e) {}
  try { hidden = Date.parse(localStorage.getItem(HKEY) || "") || 0; } catch (e) {}
  if (Date.now() - hidden < 3 * DAY) { box.hidden = true; return; }     // отложено на три дня
  const days = saved ? Math.floor((Date.now() - saved) / DAY) : -1;
  if (saved && days < 7) { box.hidden = true; return; }
  box.innerHTML = '<span class="wt">'
    + (saved ? '<b>Копия задач не сохранялась ' + days + ' дн.</b> ' : '<b>Копия задач ещё не сохранялась.</b> ')
    + 'Задачи живут в этом браузере: если его почистить или сесть за другой компьютер, они не найдутся. '
    + 'Кнопка рядом скачает файл со всеми задачами - его можно переслать и открыть где угодно.</span>'
    + '<button type="button" id="warnSave">Сохранить копию файла</button>'
    + '<button type="button" class="later" id="warnLater">Напомнить через три дня</button>';
  box.hidden = false;
}
document.addEventListener("click", e => {
  if (e.target.closest("#warnSave")) { document.getElementById("btnSave").click(); return; }
  if (e.target.closest("#warnLater")){
    try { localStorage.setItem(HKEY, new Date().toISOString()); } catch (err) {}
    document.getElementById("warn").hidden = true;
  }
});
function bkpCount(data){
  let n = 0;
  try { const d = (JSON.parse(data).db) || {}; Object.keys(d).forEach(k => n += (d[k].tasks || []).length); }
  catch (e) {}
  return n;
}
function renderBkp(){
  const list = backups(), box = document.getElementById("bkp");
  let inner = '<div class="bh">Резервные копии</div>'
    + '<div class="bt">Страница сама сохраняет состояние задач - до двенадцати последних снимков. '
    + '«Вернуть задачи» добавит недостающие задачи и отметки из снимка, ничего не стирая.</div>';
  inner += list.length
    ? list.map((b, i) => {
        const t = new Date(b.at);
        return '<div class="bkpr"><span><b>' + pad2(t.getDate()) + "." + pad2(t.getMonth() + 1) + "</b> "
          + pad2(t.getHours()) + ":" + pad2(t.getMinutes()) + ' · ' + bkpCount(b.data) + ' задач</span>'
          + '<button class="bkpb" data-i="' + i + '">Вернуть задачи</button></div>';
      }).join("")
    : '<div class="bkpe">Копий пока нет: первая появится, как только вы измените задачи.</div>';
  box.innerHTML = inner;
}
document.getElementById("btnBkp").addEventListener("click", () => {
  const box = document.getElementById("bkp");
  if (box.hidden) { renderBkp(); box.hidden = false; } else box.hidden = true;
});
document.addEventListener("click", e => {
  const b = e.target.closest(".bkpb");
  if (!b) return;
  const item = backups()[Number(b.dataset.i)];
  if (!item) return;
  const before = Object.keys(DB).reduce((s, k) => s + (DB[k].tasks || []).length, 0);
  try { mergeIn(JSON.parse(item.data)); } catch (err) { return; }
  migrate(); save(); renderAll(); renderBkp();
  const after = Object.keys(DB).reduce((s, k) => s + (DB[k].tasks || []).length, 0);
  document.getElementById("sync").textContent = after > before
    ? "из копии вернулось задач: " + (after - before)
    : "в копии не нашлось задач, которых нет сейчас";
});

document.getElementById("btnPrint").addEventListener("click", () => window.print());

document.getElementById("btnSave").addEventListener("click", () => {
  const data = JSON.stringify(payload());
  const view = document.getElementById("view").innerHTML;
  const tabs = document.getElementById("tabs").innerHTML;
  document.getElementById("view").innerHTML = "";     // копия рендерится заново при открытии
  document.getElementById("tabs").innerHTML = "";
  let html = "<!doctype html>\n<html lang=\"ru\">\n" + document.documentElement.innerHTML + "\n</html>";
  document.getElementById("view").innerHTML = view;
  document.getElementById("tabs").innerHTML = tabs;
  html = html.replace(/window\.__SAVED__ = .*?; \/\/ SAVEDLINE/,
                      "window.__SAVED__ = " + data.replace(/\$/g, "$$$$") + "; // SAVEDLINE");
  const now = new Date();
  download(html, "Отчёт a.lab - " + MN[M] + " (" + pad2(now.getDate()) + "-" + pad2(now.getMonth()+1)
                 + "-" + String(now.getFullYear()).slice(2) + ").html", "text/html;charset=utf-8");
  try { localStorage.setItem(FKEY, new Date().toISOString()); } catch (e) {}
  document.getElementById("sync").textContent = "копия файла сохранена вместе с отметками";
  renderWarn();
});

document.getElementById("btnExp").addEventListener("click", () => {
  download(JSON.stringify(payload(), null, 2), "отчёт a.lab - отметки " + mkey() + ".json", "application/json");
  document.getElementById("sync").textContent = "файл отметок выгружен - его можно отправить Александре";
});

document.getElementById("fileImp").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      mergeIn(JSON.parse(r.result));
      migrate(); save(); renderAll();
      document.getElementById("sync").textContent = "отметки из файла добавлены";
    } catch (err) {
      document.getElementById("sync").textContent = "файл не читается - нужен файл выгрузки отметок";
    }
  };
  r.readAsText(f);
  e.target.value = "";
});

load();
migrate();
renderAll();
renderWarn();
</script>
</body>
</html>
